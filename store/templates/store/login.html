
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HOUSE OF ELEGANCE</title>

    <link rel="stylesheet" href="{% static 'store/style.css' %}">

    <style>
        body.login-page {
            min-height: 100vh;
            background: #fffafa;
            position: relative;
        }

        body.login-page .auth-container {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;

            width: 420px !important;
            max-width: calc(100% - 30px) !important;

            margin: 0 !important;
            padding: 35px !important;

            background: #fff;
            border: 1px solid #f0dce2;
            border-radius: 14px;

            box-shadow: 0 12px 35px rgba(90, 30, 50, 0.10);

            text-align: center;
            float: none !important;
        }

        .auth-container h1 {
            font-family: Georgia, serif;
            color: #632139;
            margin-bottom: 10px;
        }

        .auth-container > p {
            color: #88747a;
            margin-bottom: 22px;
        }

        .auth-container form p {
            text-align: left;
            margin-bottom: 18px;
        }

        .auth-container label {
            display: block;
            color: #632139;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8d5dc;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-size: 14px;
        }

        .auth-container input:focus {
            border-color: #852747;
            box-shadow: 0 0 5px rgba(133, 39, 71, 0.15);
        }

        
        .auth-container .add-btn {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: #852747;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .auth-container .bottom-text {
            margin-top: 22px;
            color: #88747a;
            font-size: 14px;
        }

        .auth-container a {
            color: #852747;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body.login-page .auth-container {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                margin: 35px auto !important;
            }
        }
    </style>
</head>

<body class="login-page">

<header class="main-header">
    <div class="logo">HOUSE <span>OF ELEGANCE</span></div>
    <a href="/">Home</a>
</header>

<div class="auth-container">

    <h1>Welcome Back</h1>
    <p>Login to your account</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Username</label>
            <input type="text" name="username" required>
        </p>

        <p>
            <label>Password</label>
            <input type="password" name="password" required>
        </p>

        <p style="text-align: right; margin-top: -8px;">
            <a href="{% url 'password_reset' %}">
                Forgot Password?
            </a>
        </p>

        <button type="submit" class="add-btn">LOGIN</button>
    </form>

    <p class="bottom-text">
        Don't have an account?
        <a href="{% url 'signup' %}">Sign Up</a>
    </p>

</div>

</body>
</html>
