
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | HOUSE OF ELEGANCE</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>

<header class="main-header">
    <div class="logo">HOUSE <span>OF ELEGANCE</span></div>
    <a href="{% url 'login' %}">Back to Login</a>
</header>

<div class="auth-container">
    <h1>Forgot Password?</h1>
    <p>Enter your registered email address. We'll provide a link to reset your password.</p>

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Email Address</label>
            {{ form.email }}
        </p>

        <button type="submit" class="add-btn">SEND RESET LINK</button>
    </form>
</div>

</body>
</html>
